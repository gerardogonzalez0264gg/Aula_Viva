# Direccion fija dentro del cluster para cada servicio
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aulaviva
spec:
  type: ClusterIP
  selector: { app: backend }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: aulaviva
spec:
  type: ClusterIP
  selector: { app: ai-service }
  ports:
    - port: 8080
      targetPort: 8080
