name: OpenAPI Spectral Lint

on:
  push:
    paths:
      - 'api/openapi.yaml'
      - '.spectral.yaml'
      - '.github/workflows/openapi-lint.yml'

  pull_request:
    paths:
      - 'api/openapi.yaml'
      - '.spectral.yaml'
      - '.github/workflows/openapi-lint.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Instalar Spectral
        run: npm install --no-save @stoplight/spectral-cli

      - name: Ejecutar Spectral
        run: npx spectral lint api/openapi.yaml --ruleset .spectral.yaml
