# Pipeline de AulaViva
name: ci-aulaviva

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 1. Calidad del código
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Node.js
        uses: actions/setup-node@1e60f620b9541d7e6d0c8c4a5a9c1f3e6c8d2b7a # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas y cobertura
        run: npm test

  # 2. Análisis de seguridad SAST
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Semgrep
        run: semgrep scan --config p/default --severity ERROR --error

  # 3. Construcción y publicación de imágenes
  build-and-push:
    needs: [quality, sast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [backend, ai-service]
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Entrar a GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir la imagen
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./${{ matrix.servicio }}
          push: true
          tags: ghcr.io/gerardogonzalez0264gg/aulaviva-${{ matrix.servicio }}:${{ github.sha }}

  # 4. Promoción al repositorio GitOps
  promote-to-gitops:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo GitOps
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: gerardogonzalez0264gg/aulaviva-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Cambiar la version de las imagenes
        run: |
          sed -i "s/newTag: .*/newTag: ${{ github.sha }}/" overlays/dev/kustomization.yaml

      - name: Crear el pull request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b release-${GITHUB_SHA::7}
          git commit -am "Nueva version ${GITHUB_SHA::7}"
          git push origin HEAD
          gh pr create --title "Nueva version ${GITHUB_SHA::7}" --body "Pipeline automatico de AulaViva"
