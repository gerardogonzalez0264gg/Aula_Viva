# Pipeline de AulaViva: revisa el código, construye las imágenes y las promueve al repo GitOps
name: ci-aulaviva

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 1) Revisa el código: orden (lint) y pruebas con cobertura mínima 70%
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (si falla, se detiene todo)
        run: npm run lint

      - name: Pruebas y cobertura (mínimo 70%)
        run: npm test

  # 2) Revisa la seguridad del código con Semgrep (falla si hay hallazgos graves)
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Semgrep
        run: semgrep scan --config p/default --severity ERROR --error

  # 3) Construye y publica las imágenes en GHCR (solo cuando se une a main)
  build-and-push:
    needs: [quality, sast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [backend, ai-service]
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Entrar a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir la imagen
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.servicio }}
          push: true
          tags: ghcr.io/gerardogonzalez0264gg/aulaviva-${{ matrix.servicio }}:${{ github.sha }}

  # 4) Abre un pull request en el repo GitOps con la versión nueva
  promote-to-gitops:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo GitOps
        uses: actions/checkout@v4
        with:
          repository: gerardogonzalez0264gg/aulaviva-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Cambiar la versión de las imágenes
        run: sed -i "s/newTag: .*/newTag: ${{ github.sha }}/" overlays/dev/kustomization.yaml

      - name: Crear el pull request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b release-${GITHUB_SHA::7}
          git commit -am "Nueva versión ${GITHUB_SHA::7}"
          git push origin HEAD
          gh pr create --title "Nueva versión ${GITHUB_SHA::7}" --body "Pipeline automático de AulaViva"
